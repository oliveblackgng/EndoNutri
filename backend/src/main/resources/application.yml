server:
  port: 8080
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/endonutri}
    username: ${DB_USERNAME:endonutri}
    password: ${DB_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  min-research-cohort: ${MIN_RESEARCH_COHORT:10}
